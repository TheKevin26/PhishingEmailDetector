<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhishGuard</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#677084; --border:#dde1e8;
          --accent:#2f5bea; --bad:#c62828; --bad-bg:#fdecec; --good:#1e7d3a; --good-bg:#e8f5ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b1f27; --text:#e6e9ef; --muted:#9aa3b5; --border:#2c323d;
            --accent:#6f8fff; --bad:#ff6b6b; --bad-bg:#3a1d1f; --good:#5fd38a; --good-bg:#16301f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:860px; margin:0 auto; padding:32px 16px 64px; }
  h1 { margin:0 0 4px; font-size:26px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:20px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tabs button { background:none; border:1px solid var(--border); color:var(--text); padding:8px 14px; border-radius:8px; cursor:pointer; font:inherit; }
  .tabs button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input[type=text], textarea { width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  textarea { min-height:180px; resize:vertical; font-family:ui-monospace,Consolas,monospace; font-size:13px; }
  .actions { margin-top:16px; display:flex; gap:10px; flex-wrap:wrap; }
  .btn { background:var(--accent); color:#fff; border:0; padding:10px 18px; border-radius:8px; cursor:pointer; font:inherit; font-weight:600; }
  .btn.secondary { background:none; color:var(--text); border:1px solid var(--border); font-weight:400; }
  .hidden { display:none; }
  .verdict { display:flex; align-items:center; gap:16px; padding:16px; border-radius:10px; }
  .verdict.bad { background:var(--bad-bg); color:var(--bad); }
  .verdict.good { background:var(--good-bg); color:var(--good); }
  .verdict .big { font-size:24px; font-weight:700; }
  .meter { height:8px; border-radius:4px; background:var(--border); overflow:hidden; margin:12px 0 4px; }
  .meter > div { height:100%; }
  ul { padding-left:20px; } li { margin:4px 0; }
  .chips span { display:inline-block; border:1px solid var(--border); border-radius:999px; padding:2px 10px; margin:3px; font-size:13px; }
  .muted { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>PhishGuard</h1>
  <p class="sub">NLP phishing email detector. Paste an email, or upload a <code>.eml</code> file, to check it.</p>

  <div class="card">
    <div class="tabs">
      <button class="active" data-tab="fields">Subject + Body</button>
      <button data-tab="raw">Raw email / .eml</button>
    </div>
    <div id="tab-fields">
      <label for="sender">From (optional)</label>
      <input type="text" id="sender" placeholder='e.g. "PayPal Support" &lt;security@paypa1-alerts.xyz&gt;'>
      <label for="subject">Subject</label>
      <input type="text" id="subject" placeholder="Subject line">
      <label for="body">Body</label>
      <textarea id="body" placeholder="Paste the email body (text or HTML)"></textarea>
    </div>
    <div id="tab-raw" class="hidden">
      <label for="raw">Full raw message (with headers)</label>
      <textarea id="raw" placeholder="Paste 'Show original' / message source here"></textarea>
      <label for="file">…or upload an .eml file</label>
      <input type="file" id="file" accept=".eml,message/rfc822,text/plain">
    </div>
    <div class="actions">
      <button class="btn" id="check">Check email</button>
      <button class="btn secondary" id="sample-phish">Load phishing sample</button>
      <button class="btn secondary" id="sample-ham">Load legitimate sample</button>
    </div>
  </div>

  <div class="card hidden" id="result"></div>
  <p class="muted" id="status"></p>
</main>
<script>
const $ = id => document.getElementById(id);
let tab = "fields";
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("active"));
  b.classList.add("active"); tab = b.dataset.tab;
  $("tab-fields").classList.toggle("hidden", tab !== "fields");
  $("tab-raw").classList.toggle("hidden", tab !== "raw");
});
$("sample-phish").onclick = () => {
  $("sender").value = '"PayPal Security" <service@paypal-account-verify.xyz>';
  $("subject").value = "URGENT: Your account has been suspended";
  $("body").value = "Dear Customer,\n\nWe detected unusual activity on your account. Your account has been temporarily suspended. To restore access you must verify your identity within 24 hours or your account will be permanently closed.\n\nClick here to verify: http://192.168.13.7/paypal/login.php\n\nThank you,\nPayPal Security Team";
};
$("sample-ham").onclick = () => {
  $("sender").value = '"Priya Sharma" <priya.sharma@company.com>';
  $("subject").value = "Notes from Tuesday's project sync";
  $("body").value = "Hi team,\n\nThanks for joining the sync yesterday. Quick recap:\n- Backend API is on track for the 20th\n- Rahul will share the updated test plan by Friday\n- Next sync moved to Wednesday 3pm\n\nLet me know if I missed anything.\n\nBest,\nPriya";
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("check").onclick = async () => {
  $("status").textContent = "Analyzing…";
  try {
    let res;
    if (tab === "fields") {
      res = await fetch("/predict", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ sender:$("sender").value, subject:$("subject").value, body:$("body").value }) });
    } else if ($("file").files.length) {
      const fd = new FormData(); fd.append("file", $("file").files[0]);
      res = await fetch("/predict/eml", { method:"POST", body: fd });
    } else {
      res = await fetch("/predict/raw", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ raw:$("raw").value }) });
    }
    if (!res.ok) throw new Error((await res.text()) || res.statusText);
    render(await res.json());
    $("status").textContent = "";
  } catch (e) { $("status").textContent = "Error: " + e.message; }
};

function render(r) {
  const bad = r.is_phishing, pct = Math.round(r.score * 100);
  const color = bad ? "var(--bad)" : "var(--good)";
  $("result").innerHTML = `
    <div class="verdict ${bad ? "bad" : "good"}">
      <div class="big">${bad ? "⚠ PHISHING" : "✓ LEGITIMATE"}</div>
      <div>Phishing score <b>${pct}%</b> · ${esc(r.confidence)} confidence</div>
    </div>
    <div class="meter"><div style="width:${pct}%;background:${color}"></div></div>
    <p class="muted">Model: ${esc(r.model_used)} · ML score ${Math.round(r.model_score*100)}% · threshold ${Math.round(r.threshold*100)}%</p>
    <h3>Why</h3><ul>${r.reasons.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    ${r.top_terms && r.top_terms.length ? `<h3>Most suspicious terms</h3><div class="chips">${r.top_terms.map(t => `<span>${esc(t.token)}</span>`).join("")}</div>` : ""}
    ${r.email.urls && r.email.urls.length ? `<h3>Links found</h3><ul>${r.email.urls.slice(0,10).map(u => `<li><code>${esc(u)}</code></li>`).join("")}</ul>` : ""}`;
  $("result").classList.remove("hidden");
}
</script>
</body>
</html>
